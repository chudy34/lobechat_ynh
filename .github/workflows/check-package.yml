name: Check YunoHost package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n scripts/* tools/update-upstream
      - name: Check Compose configuration
        run: python3 tests/check_compose.py
      - name: Check PostgreSQL restore compatibility
        run: python3 tests/check_restore.py
      - name: Check RustFS client image availability
        run: |
          docker manifest inspect rustfs/rc:v0.1.36 | python3 -c 'import json,sys; platforms={(m["platform"]["os"],m["platform"]["architecture"]) for m in json.load(sys.stdin)["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= platforms'
          docker run --rm --entrypoint /bin/sh rustfs/rc:v0.1.36 -c 'rc --version && rc anonymous set-json --help && rc mb --help'
